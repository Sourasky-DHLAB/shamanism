name: Verify AWS media before excluding local copies
on:
  push:
    branches: ['fix/pages-external-media']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      summary: ${{ steps.media.outputs.summary }}
      hosts: ${{ steps.media.outputs.hosts }}
      first_failure: ${{ steps.media.outputs.first_failure }}
      migration_sample: ${{ steps.media.outputs.migration_sample }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /docs/data/archive.json
            /tools/check_cloudfront_media.py
          sparse-checkout-cone-mode: false
      - name: Inspect earlier AWS mapping without changing current data
        run: |
          git fetch --depth=1 origin e9c2657ffa872722e4812567ed7f1eeaf2d5da32
          git show e9c2657ffa872722e4812567ed7f1eeaf2d5da32:docs/data/archive.json > "$RUNNER_TEMP/aws-migration-archive.json"
      - name: Verify AWS media coverage
        id: media
        run: python tools/check_cloudfront_media.py
  report:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    name: '${{ needs.verify.outputs.summary }}; hosts ${{ needs.verify.outputs.hosts }}'
    steps:
      - run: echo 'Read-only AWS media coverage report.'

  mapping:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    name: 'AWS mapping ${{ needs.verify.outputs.migration_sample }}; first error ${{ needs.verify.outputs.first_failure }}'
    steps:
      - run: echo 'Earlier mapping and read-only availability result.'
