name: Research workspace tests
on:
  pull_request:
    paths:
      - 'docs/assets/**'
      - 'docs/index.html'
      - 'supabase/**'
      - 'tests/**'
      - '.github/workflows/research-tests.yml'
  push:
    branches: ['research/shared-annotations', 'feature/archive-pagination', 'feature/password-recovery']
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    outputs:
      browser_failure: ${{ steps.browser.outputs.failure }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: research_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /docs/assets/
            /docs/index.html
            /docs/reset-password.html
            /supabase/
            /tests/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JavaScript checks and store tests
        run: |
          node --check docs/assets/app.js
          node --check docs/assets/export.js
          node --check docs/assets/research-ui.js
          node --check docs/assets/research-store.js
          node --check docs/assets/password-recovery.js
          node --check docs/assets/reset-password.js
          node --test tests/research-store.test.cjs tests/password-recovery.test.cjs
      - name: PostgreSQL permission and revision tests
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: test-only-password
          PGDATABASE: research_test
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/research-db-bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/research.sql
          psql -v ON_ERROR_STOP=1 -f supabase/research-tests.sql
      - name: Browser integration tests
        id: browser
        run: |
          pip install playwright==1.61.0
          python -m playwright install --with-deps chromium
          python tests/run-browser-checks.py



  diagnostics:
    needs: research
    if: ${{ always() && needs.research.outputs.browser_failure != '' }}
    runs-on: ubuntu-latest
    name: '${{ needs.research.outputs.browser_failure }}'
    steps:
      - run: echo 'Mocked browser regression failed; see research job logs.'
