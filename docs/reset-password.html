<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reset researcher password</title>
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/research.css">
</head>
<body>
  <main class="password-reset-page panel">
    <h1>Reset your password</h1>
    <p id="reset-status" role="status" aria-live="polite">Checking your reset link…</p>
    <form id="reset-password-form" hidden>
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="8" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required>
      <button type="submit" class="button">Save new password</button>
    </form>
    <p><a href="index.html">Back to archive sign-in</a></p>
  </main>
  <script src="assets/research-config.js" defer></script>
  <script src="assets/password-recovery.js" defer></script>
  <script src="assets/reset-password.js" defer></script>
</body>
</html>
